<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" href="Img/Lester Poetico.png">
    <title>file</title>
</head>
<style>
      *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:black;
            background-repeat: no-repeat;
            background-attachment:fixed;
            background-position: center center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .formulario{
            background: #111;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            color: white;
        }

        .formulario h2{
            text-align: center;
            margin-bottom: 20px;
            color: #00bfff;
        }

        .campo{
            margin-bottom: 15px;
        }

        .campo label{
            display: block;
            margin-bottom: 5px;
        }

        .campo input,
        .campo select{
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        .botao{
            width: 100%;
            padding: 12px;
            background: #00bfff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
    
        }

        .botao:hover{
            background: #009acd;
        }
</style>
<body>
      <form class="formulario">
        <h2>Venha!</h2>

        <div class="campo">
            <label>Nome Completo</label>
            <input type="text" placeholder="Digite seu nome" required>
        </div>

        <div class="campo">
            <label>Email</label>
            <input type="email" placeholder="Digite seu email" required>
        </div>

        <div class="campo">
            <label>Senha</label>
            <input type="password" placeholder="Digite sua senha" required minlength="0"
            maxlength="8">
        </div>

        <div class="campo">
            <label>Preferencia</label>
            <select required>
                <option value="">Selecione</option>
                <option>Romance</option>
                <option>Drama</option>
                <option>Conspiração</option>
            </select>
        </div>

        <button class="botao">
                <a href="../ex.02/index.html" target="_blank">Next</a> 
        </button>
    </form>


</body>
</html>
